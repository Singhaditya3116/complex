sudo: required
services:
  - docker

before_install:
  - docker build -t multi-frontend-test -f ./client/Dockerfile.dev ./client


script:
  - docker run multi-frontend-test npm test -- --coverage

after_success:
  - docker build -t multi-client ./client
  - docker build -t multi-server ./server
  - docker build -t multi-worker ./worker
  - docker build -t multi-nginx ./nginx
  # login to docker hub
  -  echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_ID" --password-stdin
  # Take image and push to docker hub
  - docker push multi-client
  - docker push multi-server
  - docker push multi-worker
  - docker push multi-nginx

deploy:
  provider: elasticbeanstalk
  region: "us-east-1"
  app: "multi-docker"
  env: "Multi-docker-env"
  bucket_name: "elasticbeanstalk-us-east-1-991660220541"
  bucket_path: "docker-multi-proj"
  on:
    branch: main
  access_key_id: "$AWS_ACCESS_KEY"
  secret_access_key: "$AWS_SECRET_KEY"