name: "Build Test and Push Image to Docker Hub"

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker test image
        run: docker build -t multi-frontend-test -f ./client/Dockerfile.dev ./client
      - name: Run test cases
        run: docker run multi-frontend-test npm run test -- --coverage
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_ID }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build production images
        run: |
          docker build -t ${{ secrets.DOCKER_ID }}/multi-client ./client
          docker build -t ${{ secrets.DOCKER_ID }}/multi-server ./server
          docker build -t ${{ secrets.DOCKER_ID }}/multi-worker ./worker
          docker build -t ${{ secrets.DOCKER_ID }}/multi-nginx ./nginx
      - name: Push images to Docker Hub
        run : |
          docker push ${{ secrets.DOCKER_ID }}/multi-client
          docker push ${{ secrets.DOCKER_ID }}/multi-server
          docker push ${{ secrets.DOCKER_ID }}/multi-worker
          docker push ${{ secrets.DOCKER_ID }}/multi-nginx
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Generate deployment package
        run: zip -r deploy.zip docker-compose.yml
      - name: Deploy to elastic bean stalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY }}
          aws_secret_key: ${{ secrets.AWS_SECRET_KEY }}
          application_name: multi-docker
          environment_name: Multi-docker-env
          version_label: ${{ github.run_id }}
          region: us-east-1
          deployment_package: deploy.zip


